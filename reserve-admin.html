<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예약 관리 | 2026년 충남 청년네트워킹데이</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#203469;
  --brand-d:#152347;
  --brand-l:#324B8C;
  --brand-soft:#EEF3FB;
  --brand-line:#C5D5EC;
  --bg:#F4F6F9;
  --paper:#FFFFFF;
  --ink:#111827;
  --ink2:#4B5563;
  --ink3:#8B95A5;
  --line:#E5E8EB;
  --line2:#D1D6DB;
  --ok:#0D7A52;--ok-soft:#E6F4EE;
  --warn:#9A6700;--warn-soft:#FEF5E7;
  --stop:#C92A2A;--stop-soft:#FFF0F0;
  --radius:14px;
  --shadow:0 4px 20px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.02);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

/* ── 상단 기관 헤더 & GNB ── */
.topline{height:4px;background:linear-gradient(90deg,var(--brand) 0%,#3B5998 100%);}
.top{
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(17,24,39,.02);
}
.top h1{font-size:16px;font-weight:800;color:var(--brand);letter-spacing:-.02em;}
.top .org{font-size:13px;font-weight:500;color:var(--ink2);border-left:1.5px solid var(--line2);padding-left:12px;}
.top .who{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px;}
.ghost{
  background:var(--paper);border:1.5px solid var(--line2);color:var(--ink2);
  border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .15s ease;box-shadow:0 2px 6px rgba(17,24,39,.02);
}
.ghost:hover{border-color:var(--brand);color:var(--brand);background:var(--bg);}

.shell{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

/* ── 로그인 화면 ── */
.login{
  max-width:400px;margin:90px auto;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:40px 30px;text-align:center;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.login::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--brand);}
.login h2{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;}
.login p{font-size:13.5px;color:var(--ink2);margin-bottom:24px;line-height:1.5;}
.gbtn{
  width:100%;padding:13px;border:none;border-radius:10px;background:var(--brand);
  color:#fff;font-size:15px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 12px rgba(32,52,105,.25);transition:all .15s ease;
}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(32,52,105,.32);}

/* ── 대시보드 요약 카드 ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.mc{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--brand-line);}
.mc:nth-child(2)::before{background:var(--brand);}
.mc:nth-child(3)::before{background:#3B5998;}
.mc:nth-child(4)::before{background:var(--ok);}
.mc:nth-child(5)::before{background:var(--ink3);}
.mc:nth-child(6)::before{background:var(--warn);}
.mc .l{font-size:12.5px;color:var(--ink3);font-weight:600;}
.mc .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;color:var(--ink);}

/* ── 섹션 타이틀 ── */
.sec{
  font-size:16px;font-weight:800;color:var(--ink);margin:28px 2px 12px;
  display:flex;align-items:center;gap:8px;letter-spacing:-.02em;
}
.sec .act{margin-left:auto;display:flex;gap:6px;}

/* ── 회차별 현황 보드 ── */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
.col{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
}
.col .hd{
  background:linear-gradient(135deg, var(--brand-d) 0%, var(--brand) 100%);
  color:#fff;padding:14px 18px;font-size:14.5px;font-weight:800;display:flex;gap:8px;align-items:center;
}
.col .hd span{margin-left:auto;font-weight:600;opacity:.9;font-size:13px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:6px;}
.row{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);}
.row:first-of-type{border-top:none;}
.row.slothead{background:#FAFBFC;padding-top:10px;padding-bottom:10px;border-top:1.5px solid var(--line);}
.row.slothead .time{color:var(--ink);font-size:14px;}
.b-shut{background:#F1F3F6;color:var(--ink3);border:1px solid var(--line2);}
.row .time{font-size:13.5px;font-weight:800;width:52px;flex:none;color:var(--ink2);}
.row .who2{flex:1;min-width:0;font-size:14px;}
.row .who2 .nm{font-weight:700;color:var(--ink);}
.row .who2 .ph{font-size:12px;color:var(--ink3);margin-top:1px;}

/* ── 뱃지 및 버튼 디자인 통일 ── */
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;}
.b-dup{background:var(--warn-soft);color:var(--warn);border:1px solid #F5D9A5;}
.b-walk{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);}
.b-full{background:var(--stop-soft);color:var(--stop);border:1px solid #F5C2C7;}
.b-left{background:var(--ok-soft);color:var(--ok);border:1px solid #B7E4C7;}

.mini{
  background:var(--paper);border:1.5px solid var(--line2);color:var(--ink3);cursor:pointer;
  font-size:12px;width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;transition:all .15s;
}
.mini:hover{background:var(--stop-soft);border-color:var(--stop);color:var(--stop);}

.att{
  background:var(--paper);border:1.5px solid var(--line2);color:var(--ink2);cursor:pointer;
  font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;flex:none;white-space:nowrap;
  transition:all .15s;box-shadow:0 1px 2px rgba(17,24,39,.02);
}
.att:hover{border-color:var(--ok);color:var(--ok);}
.att.on{background:var(--ok);border-color:var(--ok);color:#fff;}

/* ── 테이블 뷰 ── */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{background:var(--bg);text-align:left;padding:13px 16px;font-weight:700;color:var(--ink2);font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line);}
td{padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink);}
tr:last-child td{border-bottom:none;}

/* ── 패널 및 입력폼 ── */
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.f{display:flex;flex-direction:column;gap:7px;}
.f label{font-size:13px;color:var(--ink);font-weight:700;}
.f input,.f select{
  font-size:15px;padding:12px 14px;border:1.5px solid var(--line2);
  border-radius:10px;background:#FAFBFC;transition:all .18s ease;
}
.f input:focus,.f select:focus{outline:none;border-color:var(--brand);background:var(--paper);box-shadow:0 0 0 4px var(--brand-soft);}
.go{
  background:linear-gradient(135deg, var(--brand) 0%, var(--brand-l) 100%);
  color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:14.5px;
  font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(32,52,105,.25);transition:all .15s;
}
.go:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(32,52,105,.32);}
.msg{font-size:13px;margin-left:10px;font-weight:600;}
.msg.ok{color:var(--ok);} .msg.err{color:var(--stop);}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;}
.switch input{width:20px;height:20px;accent-color:var(--brand);cursor:pointer;}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>

<div id="login-view" style="display:none;">
  <div class="login">
    <h2>1:1 상담 사전예약 관리</h2>
    <p>2026년 충남 청년네트워킹데이<br>충남일자리경제진흥원 충남일자리종합센터</p>
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()"
      style="width:100%;font-size:15px;padding:13px 15px;border:1.5px solid var(--line2);border-radius:10px;margin-bottom:14px;text-align:center;background:#FAFBFC;">
    <button class="gbtn" id="login-btn" onclick="login()">입장</button>
    <p id="login-msg" style="margin:16px 0 0;color:var(--stop);font-size:13px;font-weight:700;"></p>
  </div>
</div>

<div id="app-view" style="display:none;">
  <div class="topline"></div>
  <div class="top">
    <h1>1:1 상담 사전예약 관리</h1>
    <span class="org"><b>2026년 충남 청년네트워킹데이</b></span>
    <span class="badge b-left" id="open-state" style="margin-left:4px;">접수중</span>
    <div class="who">
      <span id="who" style="font-weight:600;"></span>
      <button class="ghost" onclick="exportCsv()">엑셀 내려받기</button>
      <button class="ghost" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="shell">
    <div class="cards" id="cards"></div>

    <div class="sec">회차별 현황 (13:50 ~ 16:10, 총 15회차)
      <span class="act"><button class="ghost" onclick="toggleView()" id="vbtn">명단으로 보기</button></span>
    </div>
    <div id="board"></div>
    <div id="list" style="display:none;"></div>

    <div class="sec">현장 접수</div>
    <div class="panel">
      <div class="grid" style="margin-bottom:16px;">
        <div class="f"><label>이름</label><input type="text" id="w-name" placeholder="홍길동"></div>
        <div class="f"><label>연락처</label><input type="tel" id="w-phone" placeholder="010-1234-5678"></div>
        <div class="f"><label>상담 분야</label><select id="w-track"></select></div>
        <div class="f"><label>시간</label><select id="w-slot"></select></div>
      </div>
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;">
        <button class="go" onclick="addWalkIn()">예약 추가</button>
        <span id="w-msg" class="msg"></span>
      </div>
      <div class="hint">현장에서 받은 예약을 직접 넣습니다. 정원이 찬 회차도 추가할 수 있어요.</div>
    </div>

    <div class="sec">운영 설정</div>
    <div class="panel">
      <div class="grid" style="margin-bottom:18px;">
        <div class="f"><label>시작 시각</label><input type="time" id="c-start"></div>
        <div class="f"><label>종료 시각</label><input type="time" id="c-end"></div>
        <div class="f"><label>회차 길이 (분)</label><input type="number" id="c-min" min="5" max="60" step="5"></div>
        <div class="f"><label>A트랙 회차당 정원</label><input type="number" id="c-cap-a" min="1" max="20"></div>
        <div class="f"><label>B트랙 회차당 정원</label><input type="number" id="c-cap-b" min="1" max="20"></div>
        <div class="f"><label>행사 날짜</label><input type="date" id="c-date"></div>
        <div class="f"><label>자동 마감 (분 전)</label><input type="number" id="c-close" min="0" max="60"></div>
      </div>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
        <button class="go" onclick="saveCfg()">설정 저장</button>
        <label class="switch"><input type="checkbox" id="c-open"> 신청 접수 열기</label>
        <span id="c-msg" class="msg"></span>
      </div>
      <div class="hint">운영 시간은 13:50 ~ 16:20(마지막 회차 16:10), 정원은 A트랙 4명·B트랙 2명으로 설정되어 있습니다.</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, collection, onSnapshot, runTransaction, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC9kEfmFLlWhxXdE-B72DJhHPIJlqwDSok",
  authDomain: "networking-day-2026.firebaseapp.com",
  projectId: "networking-day-2026",
  storageBucket: "networking-day-2026.firebasestorage.app",
  messagingSenderId: "367967346348",
  appId: "1:367967346348:web:636acc1f330016c628c909"
};
const ADMIN_EMAIL = 'star05@cepa.or.kr';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const TRACKS = [
  {id:'A', tag:'A 트랙', title:'11/20 쿠팡 대규모 채용 관련 상담'},
  {id:'B', tag:'B 트랙', title:'맞춤형 일반 취업 지원 상담'},
];
let CFG = {
  open:true,
  start:'13:50',
  end:'16:20',
  slotMin:10,
  capA:4,
  capB:2,
  eventDate:'2026-11-06',
  closeBefore:3
};
let bookings = [];
let slotMeta = {};
let viewList = false;

const toMin = s=>{const[h,m]=s.split(':').map(Number);return h*60+m;};
const toHHMM= m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const key   = (t,s)=>`${t}_${s.replace(':','')}`;
const esc   = s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const digits= s=>(s||'').replace(/\D/g,'');

function capOf(trackId){
  return trackId==='A' ? (Number(CFG.capA)||4) : (Number(CFG.capB)||2);
}

function slotList(){
  const a=toMin(CFG.start), b=Math.min(toMin(CFG.end), toMin('16:20')), n=Number(CFG.slotMin)||10;
  const out=[]; for(let t=a;t+n<=b;t+=n) out.push(toHHMM(t));
  return out;
}

window.login = async function(){
  const pw=document.getElementById('pw').value;
  const msg=document.getElementById('login-msg');
  const btn=document.getElementById('login-btn');
  if(!pw){ msg.textContent='비밀번호를 입력해 주세요.'; return; }
  btn.disabled=true; btn.textContent='확인 중…'; msg.textContent='';
  try{
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pw);
  }catch(e){
    const c=e.code||'';
    msg.textContent = (c.includes('wrong-password')||c.includes('invalid-credential'))
      ? '비밀번호가 올바르지 않습니다.'
      : c.includes('too-many-requests')
      ? '시도가 많아 잠시 차단되었습니다. 잠시 후 다시 시도해 주세요.'
      : '로그인에 실패했습니다. 관리자 계정 설정을 확인해 주세요.';
    document.getElementById('pw').value='';
  }finally{
    btn.disabled=false; btn.textContent='입장';
  }
}
window.logout = ()=>signOut(auth);

let started=false;
onAuthStateChanged(auth, async user=>{
  const login=document.getElementById('login-view'), appv=document.getElementById('app-view');
  if(!user || user.email!==ADMIN_EMAIL){
    login.style.display='block'; appv.style.display='none';
    if(user) await signOut(auth);
    return;
  }
  login.style.display='none'; appv.style.display='block';
  document.getElementById('pw').value='';
  document.getElementById('who').textContent='관리자';
  if(!started){ started=true; start(); setInterval(render,60000); }
});

function start(){
  onSnapshot(doc(db,'config','settings'), s=>{
    if(s.exists()) CFG={...CFG,...s.data()};
    CFG.start = '13:50';
    CFG.end   = '16:20';
    CFG.capA  = Number(CFG.capA) || 4;
    CFG.capB  = Number(CFG.capB) || 2;
    fillCfg(); fillWalkIn(); render();
  });
  onSnapshot(collection(db,'slots'), ss=>{
    slotMeta={}; ss.forEach(d=>{slotMeta[d.id]=d.data()||{};});
    render();
  });
  onSnapshot(collection(db,'bookings'), ss=>{
    bookings=[]; ss.forEach(d=>bookings.push({id:d.id,...d.data()}));
    render();
  });
}

function dupSet(){
  const n={}; bookings.forEach(b=>{const k=digits(b.phone); if(k)n[k]=(n[k]||0)+1;});
  return new Set(Object.keys(n).filter(k=>n[k]>1));
}

function render(){
  const slots=slotList(), dups=dupSet();

  document.getElementById('open-state').textContent = CFG.open?'접수중':'접수마감';
  document.getElementById('open-state').className = 'badge '+(CFG.open?'b-left':'b-full');

  const total=bookings.length;
  const att=bookings.filter(b=>b.attended).length;
  document.getElementById('cards').innerHTML=`
    <div class="mc"><div class="l">총 예약</div><div class="v">${total}명</div></div>
    ${TRACKS.map(t=>{
      const cnt=bookings.filter(b=>b.track===t.id).length;
      const tCap=slots.length*capOf(t.id);
      return `<div class="mc"><div class="l">${t.tag} (회차당 ${capOf(t.id)}명)</div>
        <div class="v">${cnt}<span style="font-size:13px;color:var(--ink3);font-weight:400;"> / ${tCap}</span></div></div>`;
    }).join('')}
    <div class="mc"><div class="l">참석</div><div class="v" style="color:var(--ok);">${att}<span style="font-size:13px;color:var(--ink3);font-weight:400;"> / ${total}</span></div></div>
    <div class="mc"><div class="l">미참석</div><div class="v">${total-att}명</div></div>
    <div class="mc"><div class="l">중복 신청자</div><div class="v" style="color:var(--warn);">${dups.size}명</div></div>`;

  document.getElementById('board').innerHTML=`<div class="board">${TRACKS.map(t=>{
    const maxCap = capOf(t.id);
    return `
    <div class="col">
      <div class="hd">${t.tag} (정원 ${maxCap}명) <span>${bookings.filter(b=>b.track===t.id).length}명</span></div>
      ${slots.map(s=>{
        const list=bookings.filter(b=>b.track===t.id&&b.slot===s)
          .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
        const shut=!!(slotMeta[key(t.id,s)]&&slotMeta[key(t.id,s)].closed);
        const past=isPast(s);
        const left=Math.max(0,maxCap-list.length);
        const state = shut?'<span class="badge b-full">마감함</span>'
          : past?'<span class="badge b-shut">시간 지남</span>'
          : left>0?`<span class="badge b-left">${left}자리</span>`
          : '<span class="badge b-full">정원 참</span>';
        const head=`<div class="row slothead">
          <span class="time">${s}</span>
          <span class="who2">${state}</span>
          <button class="att ${shut?'on':''}" style="font-weight:700;"
            onclick="toggleClose('${t.id}','${s}')">${shut?'열기':'마감'}</button>
        </div>`;
        if(!list.length) return head;
        return head + list.map(b=>`<div class="row">
          <span class="time"></span>
          <span class="who2"><span class="nm">${esc(b.name)}</span>
            ${dups.has(digits(b.phone))?'<span class="badge b-dup" style="margin-left:5px;">중복</span>':''}
            ${b.source==='현장'?'<span class="badge b-walk" style="margin-left:4px;">현장</span>':''}
            <span class="ph" style="display:block;">${esc(b.phone)}</span></span>
          <button class="att ${b.attended?'on':''}" title="참석 표시" onclick="attend('${b.id}')">${b.attended?'참석 ✓':'참석'}</button>
          <button class="mini" title="예약 취소" onclick="cancel('${b.id}')">✕</button>
        </div>`).join('');
      }).join('')}
    </div>`;
  }).join('')}</div>`;

  const sorted=[...bookings].sort((a,b)=> a.slot===b.slot ? a.track.localeCompare(b.track) : a.slot.localeCompare(b.slot));
  document.getElementById('list').innerHTML = sorted.length ? `<div class="tbl"><table>
    <thead><tr><th>시간</th><th>트랙</th><th>이름</th><th>연락처</th><th>참석</th><th>비고</th><th></th></tr></thead>
    <tbody>${sorted.map(b=>`<tr>
      <td style="font-weight:700;">${b.slot}</td>
      <td>${TRACKS.find(t=>t.id===b.track)?.tag||b.track}</td>
      <td style="font-weight:700;">${esc(b.name)}</td>
      <td>${esc(b.phone)}</td>
      <td><button class="att ${b.attended?'on':''}" onclick="attend('${b.id}')">${b.attended?'참석 ✓':'참석'}</button></td>
      <td>${dups.has(digits(b.phone))?'<span class="badge b-dup">중복 신청</span> ':''}
          ${b.source==='현장'?'<span class="badge b-walk">현장 접수</span>':''}</td>
      <td><button class="mini" onclick="cancel('${b.id}')">✕</button></td>
    </tr>`).join('')}</tbody></table></div>`
    : '<div class="panel" style="text-align:center;color:var(--ink3);">아직 예약이 없습니다.</div>';
}

window.toggleView=function(){
  viewList=!viewList;
  document.getElementById('board').style.display=viewList?'none':'block';
  document.getElementById('list').style.display=viewList?'block':'none';
  document.getElementById('vbtn').textContent=viewList?'회차별로 보기':'명단으로 보기';
}

window.toggleClose = async function(track,slot){
  const id=key(track,slot);
  const now=!!(slotMeta[id]&&slotMeta[id].closed);
  try{
    await setDoc(doc(db,'slots',id),{track,slot,closed:!now},{merge:true});
  }catch(e){ alert('회차 마감 처리에 실패했습니다.'); }
}

function isPast(slot){
  if(!CFG.eventDate) return false;
  const now=new Date();
  const ymd=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  if(ymd!==CFG.eventDate) return false;
  return now.getHours()*60+now.getMinutes() >= toMin(slot)-(Number(CFG.closeBefore)||0);
}

window.attend = async function(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  try{ await setDoc(doc(db,'bookings',id),{attended:!b.attended},{merge:true}); }
  catch(e){ alert('참석 표시에 실패했습니다. 다시 시도해 주세요.'); }
}

window.cancel = async function(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  if(!confirm(`${b.name} (${b.slot}, ${b.track}트랙) 예약을 취소할까요?`)) return;
  try{
    await runTransaction(db, async tx=>{
      const slotRef=doc(db,'slots',key(b.track,b.slot));
      const snap=await tx.get(slotRef);
      const used=snap.exists()?(snap.data().count||0):0;
      tx.set(slotRef,{track:b.track,slot:b.slot,count:Math.max(0,used-1)},{merge:true});
      tx.delete(doc(db,'bookings',id));
    });
  }catch(e){ alert('취소에 실패했습니다. 다시 시도해 주세요.'); }
}

function fillWalkIn(){
  const tsel=document.getElementById('w-track');
  if(!tsel.options.length) tsel.innerHTML=TRACKS.map(t=>`<option value="${t.id}">${t.tag} · ${t.title}</option>`).join('');
  const ssel=document.getElementById('w-slot'), keep=ssel.value;
  ssel.innerHTML=slotList().map(s=>`<option>${s}</option>`).join('');
  if(keep) ssel.value=keep;
}
window.addWalkIn = async function(){
  const name=document.getElementById('w-name').value.trim();
  const phone=document.getElementById('w-phone').value.trim();
  const track=document.getElementById('w-track').value;
  const slot=document.getElementById('w-slot').value;
  const msg=document.getElementById('w-msg');
  if(!name||!phone){ msg.textContent='이름과 연락처를 입력해 주세요'; msg.className='msg err'; return; }
  try{
    await runTransaction(db, async tx=>{
      const slotRef=doc(db,'slots',key(track,slot));
      const snap=await tx.get(slotRef);
      const used=snap.exists()?(snap.data().count||0):0;
      tx.set(slotRef,{track,slot,count:used+1},{merge:true});
      tx.set(doc(collection(db,'bookings')),{name,phone,track,slot,status:'예약',source:'현장',createdAt:serverTimestamp()});
    });
    document.getElementById('w-name').value='';
    document.getElementById('w-phone').value='';
    msg.textContent='추가했습니다'; msg.className='msg ok';
    setTimeout(()=>msg.textContent='',2500);
  }catch(e){ msg.textContent='추가에 실패했습니다'; msg.className='msg err'; }
}

function fillCfg(){
  document.getElementById('c-start').value='13:50';
  document.getElementById('c-end').value='16:20';
  document.getElementById('c-min').value=CFG.slotMin||10;
  document.getElementById('c-cap-a').value=capOf('A');
  document.getElementById('c-cap-b').value=capOf('B');
  document.getElementById('c-open').checked=!!CFG.open;
  document.getElementById('c-date').value=CFG.eventDate||'';
  document.getElementById('c-close').value=CFG.closeBefore??3;
}
window.saveCfg = async function(){
  const msg=document.getElementById('c-msg');
  const next={
    start:document.getElementById('c-start').value||'13:50',
    end:document.getElementById('c-end').value||'16:20',
    slotMin:parseInt(document.getElementById('c-min').value)||10,
    capA:parseInt(document.getElementById('c-cap-a').value)||4,
    capB:parseInt(document.getElementById('c-cap-b').value)||2,
    open:document.getElementById('c-open').checked,
    eventDate:document.getElementById('c-date').value||'',
    closeBefore:parseInt(document.getElementById('c-close').value)||0
  };
  if(toMin(next.end)<=toMin(next.start)){ msg.textContent='종료 시각이 시작보다 빨라요'; msg.className='msg err'; return; }
  try{
    await setDoc(doc(db,'config','settings'),next,{merge:true});
    msg.textContent='저장했습니다'; msg.className='msg ok';
    setTimeout(()=>msg.textContent='',2500);
  }catch(e){ msg.textContent='저장에 실패했습니다'; msg.className='msg err'; }
}

window.exportCsv = function(){
  const dups=dupSet();
  const rows=[['시간','트랙','이름','연락처','참석','접수경로','비고']];
  [...bookings].sort((a,b)=> a.slot===b.slot ? a.track.localeCompare(b.track) : a.slot.localeCompare(b.slot))
    .forEach(b=>rows.push([b.slot, b.track, b.name, b.phone, b.attended?'참석':'',
      b.source||'온라인', dups.has(digits(b.phone))?'중복 신청':'']));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`상담예약_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

document.getElementById('w-phone').addEventListener('input',e=>{
  const v=digits(e.target.value).slice(0,11);
  e.target.value = v.length>7 ? `${v.slice(0,3)}-${v.slice(3,7)}-${v.slice(7)}`
                 : v.length>3 ? `${v.slice(0,3)}-${v.slice(3)}` : v;
});
</script>
